spring.application.name=hotel-management-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql-migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-duration=${LOGIN_LOCK_DURATION:PT15M}
app.security.bootstrap-admin.login=${INITIAL_ADMIN_LOGIN:}
app.security.bootstrap-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.reservation.pending-ttl=${RESERVATION_PENDING_TTL:PT15M}

app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success?session_id={CHECKOUT_SESSION_ID}}
app.payment.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancelled}

spring.mail.host=${SMTP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.default-encoding=${SMTP_DEFAULT_ENCODING:UTF-8}

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
