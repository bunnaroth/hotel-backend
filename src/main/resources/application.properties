spring.application.name=hotel-management-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql-migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.mail.enabled=false

app.reservation.pending-ttl=PT15M
app.reservation-lookup.hmac-key=${RESERVATION_LOOKUP_HMAC_KEY:}
app.reservation-lookup.max-requests-per-lookup-per-hour=3
app.reservation-lookup.max-requests-per-ip-per-hour=10

app.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success?session_id={CHECKOUT_SESSION_ID}}
app.payment.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancelled}

spring.mail.host=${HOTEL_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${HOTEL_MAIL_PORT:587}
spring.mail.username=${HOTEL_MAIL_USERNAME:}
spring.mail.password=${HOTEL_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8
app.mail.from=${HOTEL_MAIL_FROM:no-reply@example.com}

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
